name: Release Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: >-
          pyinstaller --clean --noconfirm --onefile --windowed
          --name TacticalOpsConsole
          --hidden-import pyttsx3.drivers
          --hidden-import pyttsx3.drivers.sapi5
          --collect-submodules comtypes
          --hidden-import keyboard
          main.py

      - name: Include default configuration
        run: Copy-Item config.json dist/config.json

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Tactical Ops Console ${{ github.event.inputs.release_tag || github.ref_name }}
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/TacticalOpsConsole.exe
            dist/config.json
